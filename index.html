<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Home jobs at a fixed price across London: cleaning, painting, repairs and landlord certificates. See the price before you book, pick a day and pay online in two minutes." />
    <meta name="keywords" content="facilities management, commercial maintenance, UK trades, property compliance, SLA tracking, asset register, Gas Safe, NICEIC, EICR" />
    <meta name="author" content="Fixfy Ltd" />
    <meta name="theme-color" content="#ED4B00" />
    <link rel="canonical" href="https://getfixfy.com" />
    <title>Fixed-price cleaning, painting and repairs in London | Fixfy</title>
    <!-- Geist & Geist Mono (Fixfy brand fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@500;600&display=swap" rel="stylesheet" />
    <!-- Google Maps API will be loaded dynamically -->
    
    <!-- Consentimento de cookies (PECR): Pixel, Google Analytics, Clarity,
         PageSense, GTM e o chat da Zoho só carregam depois do sim da categoria.
         O banner (src/components/CookieConsent.jsx) chama window.fixfyConsent.apply;
         quem já escolheu antes carrega aqui mesmo, antes do React. Fora do
         getfixfy.com nada carrega: localhost e prévias da Vercel não sujam os números. -->
    <script>
    (function (w, d) {
      var LIVE = /(^|\.)getfixfy\.com$/.test(w.location.hostname);
      var loaded = {};
      function script(src, id) {
        var s = d.createElement('script');
        s.async = true;
        s.src = src;
        if (id) s.id = id;
        d.head.appendChild(s);
      }
      var loaders = {
        analytics: function () {
          w.dataLayer = w.dataLayer || [];
          w.gtag = w.gtag || function () { w.dataLayer.push(arguments); };
          w.gtag('js', new Date());
          w.gtag('config', 'G-YPVCS2DXF9');
          script('https://www.googletagmanager.com/gtag/js?id=G-YPVCS2DXF9');
          w.clarity = w.clarity || function () { (w.clarity.q = w.clarity.q || []).push(arguments); };
          script('https://www.clarity.ms/tag/np97wn3zh3');
          script('https://cdn-eu.pagesense.io/js/20106057743/76827fe18c2846bea774d285f2ddb2f0.js');
        },
        marketing: function () {
          if (w.fbq) return;
          var n = w.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); };
          if (!w._fbq) w._fbq = n;
          n.push = n;
          n.loaded = true;
          n.version = '2.0';
          n.queue = [];
          script('https://connect.facebook.net/en_US/fbevents.js');
          w.fbq('init', '1555218078932742');
          w.fbq('track', 'PageView');
        },
        functional: function () {
          w.$zoho = w.$zoho || {};
          w.$zoho.salesiq = w.$zoho.salesiq || { ready: function () {} };
          script('https://salesiq.zoho.eu/widget?wc=siq3e404450ccb37370f74ba15ecf5f6530793df23072c7a0654214923253a62e753b59e057da4886fa69acdcce754303f3', 'zsiqscript');
        },
        // O GTM (GTM-5RR9M23N) saiu daqui em 22/09/2026: o container é do site
        // antigo e as tags de Meta que moram nele mandavam PageView e Purchase
        // de novo, sem o nosso event id, então a Meta contava a mesma visita e a
        // mesma compra duas vezes. Analytics, Clarity, PageSense e o Pixel são
        // carregados aqui em cima, um a um. Tag nova entra por aqui, não por lá.
        tags: function () {}
      };
      function run(name) {
        if (loaded[name]) return;
        loaded[name] = true;
        if (LIVE) loaders[name]();
      }
      function apply(p) {
        if (!p) return;
        if (p.analytics) run('analytics');
        if (p.marketing) run('marketing');
        if (p.functional) run('functional');
        if (p.analytics && p.marketing) run('tags');
      }
      function saved() {
        try { return JSON.parse(w.localStorage.getItem('cookieConsent') || 'null'); } catch (e) { return null; }
      }
      w.fixfyConsent = { apply: apply, saved: saved, loaded: loaded, live: LIVE };
      apply(saved());
    })(window, document);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
